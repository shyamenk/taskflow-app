server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    include /etc/nginx/security-headers.conf;

    # Hide version information
    server_tokens off;

    # SPA routing (React / Vue / Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it names the hashed asset files, so a
    # stale copy would keep serving an old release. try_files lands here too.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Vite puts a content hash in every file name under /assets/, so these files
    # never change and can be cached for a year. Cache-Control is set with
    # add_header only; adding "expires" as well would send a second header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
    }
}
